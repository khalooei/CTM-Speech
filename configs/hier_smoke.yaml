seed: 0
resume: true
output_dir: runs/hier_smoke
gate: transcript
refine_top_frames: 16
refine_max_cells: 256
random_seeds: 2
decode_batch_seconds: 320
decode_batch_max: 48
data:
  manifest: data/manifests/librispeech_test_clean.jsonl
  esc50_root: data/esc50
  sample_rate: 16000
  max_utterances: 1
asr:
  surrogate: facebook/wav2vec2-base-960h
  evaluator: facebook/hubert-large-ls960-ft
  evaluator2: facebook/wav2vec2-large-960h-lv60-self
codecs:
  - name: dac
    model_type: 16khz
    bitrate: 8kbps
    load_path: checkpoints/dac/weights_16khz.pth
  - name: mimi
    num_codebooks: 8
    load_path: checkpoints/mimi/tokenizer-e351c8d8-checkpoint125.safetensors
  - name: speechtokenizer
    config_path: checkpoints/speechtokenizer/config.json
    ckpt_path: checkpoints/speechtokenizer/SpeechTokenizer.pt
rankings: [intervention, frame_block, random, rvq_early, displacement, margin, gradient, energy]
conditions:
  - condition_id: gaussian_snr5
    kind: gaussian
    params: {snr_db: 5}
  - condition_id: pgd_ctc_eps0.02
    kind: pgd_ctc
    params: {eps: 0.02, step_size: 0.002, steps: 20}
  - condition_id: opus_8k
    kind: opus
    params: {bitrate: 8000}
